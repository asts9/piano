<body>
  <section id="wrap">
    <header>
      <h1>PiaNo</h1>
      <h3>Use your keyboard. Hover for hints.</h3>
      <h2>
        Step into a world of sound — headphones give you the front-row seat!
      </h2>
      <link rel="stylesheet" href="piano.css" />
    </header>
    <section id="main">
      <div class="nowplaying"></div>
      <div class="keys">
        <div data-key="a" class="key" data-note="C">
          <span class="hints">A</span>
        </div>
        <div data-key="87" class="key sharp" data-note="C#">
          <span class="hints">W</span>
        </div>
        <div data-key="s" class="key" data-note="D">
          <span class="hints">S</span>
        </div>
        <div data-key="69" class="key sharp" data-note="D#">

        </div>

        </div>
        <div data-key="f" class="key" data-note="F">

        </div>
        <div data-key="g" class="key" data-note="G">

        </div>

          <span class="hints">L</span>
        </div>
        <div data-key="80" class="key sharp" data-note="D#">
          <span class="hints">P</span>
        </div>
        <div data-key=";" class="key" data-note="E">
          <span class="hints">;</span>
        </div>
